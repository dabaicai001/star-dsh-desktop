# StarHub web 组合的 profile 用户层(内核替换 P0 spike)。
# boot.mjs 把它拷到 $DSH_HOME/profiles/web/cordis.patch.yml;patch 会整段替换
# 目标行的 config,所以 webserver 行在此完整重述自己的 host/port。

# webserver 端口模板(避开默认 3080):Rust 物化 profile 时由
# rewrite_patch_port 改写为实际端口——开发(debug)实例 3185 起、正式
# (release)实例 3085,见 src-tauri/src/harness/web.rs 的 DEFAULT_PORT。
- id: webserver
  config:
    host: 127.0.0.1
    port: 3185

# StarHub 壳导航由 client-nav 注册 DSH React 原生工作台入口。
# starhub-host-static 将 React 资产工作台托管在 /starhub-react/，dist 路径由
# STARHUB_WINDOW_DIST 或仓库布局解析。
- insert:
    - id: client-nav
      name: '@deepseek-ai/dsh-starhub-client-nav'
    - id: starhub-host-static
      name: '@deepseek-ai/dsh-starhub-host-static'
    # AI 上下文绑定(方案 4.3):host 插件,pre-step 时把当前 StarHub 工具
    # 选择(settings 里由 client-nav 写入)注入 agent 请求。
    - id: starhub-tool-context
      name: '@deepseek-ai/dsh-starhub-tool-context'
    # 联动(2026-08-18):壳内(web)会话获得 starhub_* 域工具——sdk-jsonrpc-server
    # 暴露 sdk-transport / sdk-notifications,starhub-tools 经 stdio 桥回 Rust 主
    # 进程执行;session-registry / domain-events / live-context 消费 Rust 推送的
    # 注册表与领域事件,pre-step 注入活性上下文;approval-bridge 只保留权限固定
    # 与风险门(answerer:false,应答交给 web 自己的浏览器确认框,避免双应答)。
    # 依赖:这些包在 vendor 仓库包清单内,web.rs 会为它们补 junction。
    # ownsPermissionSettings:false —— permission 命名空间由 dsh-base 的
    # permission-presets 持有(GUI「设置 → 通用 → 权限」的写入方),本桥只读消费;
    # 双注册会触发 settings 的 duplicate-registration 硬失败,先注册者胜出后
    # permission-presets 静默失效,GUI 权限行读到无 defaultPreset 的裸注册。
    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
    - id: starhub-tools
      name: '@deepseek-ai/dsh-starhub-tools'
    - id: starhub-approval-bridge
      name: '@deepseek-ai/dsh-starhub-approval-bridge'
      config:
        answerer: false
        ownsPermissionSettings: false
    - id: starhub-session-registry
      name: '@deepseek-ai/dsh-starhub-session-registry'
    - id: starhub-domain-events
      name: '@deepseek-ai/dsh-starhub-domain-events'
    - id: starhub-live-context
      name: '@deepseek-ai/dsh-starhub-live-context'
    # 长期记忆注入(2026-08-21):pre-step 经 sdk-transport 反向 pull
    # `starhub/memory.cards`(user + global + 工作区文件夹 + 绑定资产),注入
    # 每个 agent 请求;开关走 `starhub-memory-context` settings namespace
    # (设置 → AI 助手「启用长期记忆」,client-nav 写入)。
    - id: starhub-memory-context
      name: '@deepseek-ai/dsh-starhub-memory-context'
    # 长期记忆自动沉淀(2026-08-22,v0.92.0):agent/turn-stopping 钩子调一次
    # LLM 抽取当轮持久事实,经 sdk-transport 反向 RPC `starhub/memory.write`
    # 落 ai_memories;默认开,kill switch 走 `starhub-memory-context.autoReview`
    # namespace 字段(设置 → AI 助手「自动沉淀记忆」,client-nav 写入)。
    - id: starhub-memory-sink
      name: '@deepseek-ai/dsh-starhub-memory-sink'
    # AI 生成提交信息(2026-08-22):分支胶囊「AI」按钮的 host 端点
    # (POST /starhub/git/commit-message),经 agentDefaultModel 当前路由做
    # one-shot LLM 调用;输入/输出/超时预算在此显式配置。
    - id: starhub-commit-message
      name: '@deepseek-ai/dsh-starhub-commit-message'
      config:
        maxInputBytes: 16384
        maxOutputTokens: 512
        timeoutMs: 30000
