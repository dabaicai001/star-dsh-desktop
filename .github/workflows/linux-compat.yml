name: Linux compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-24-04:
    name: Ubuntu 24.04 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
          - name: ARM64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          # ARM64 runners fetch from ports.ubuntu.com which is prone to
          # transient timeouts; configure apt retries and loop the install.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install --no-install-recommends -y \
              build-essential \
              cpio \
              file \
              libayatana-appindicator3-dev \
              libfuse2 \
              libgtk-3-dev \
              libpipewire-0.3-dev \
              libspa-0.2-dev \
              librsvg2-dev \
              libsqlite3-dev \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libxdo-dev \
              patchelf \
              pkg-config \
              rpm && break
            echo "apt-get install attempt $i failed, retrying in 10s..."
            sleep 10
            sudo apt-get update
          done
          # Verify the critical package installed; fail loudly if not.
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || { echo "ERROR: libwebkit2gtk-4.1-dev not installed"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Check frontend production build
        run: npm run build:window

      - name: Test Go sidecar
        working-directory: sidecar
        run: go test ./...

      - name: Build and verify native Linux sidecar
        run: npm run sidecar:build:release

      - name: Package dsh runtime
        run: npm run package:dsh-runtime

      - name: Test Tauri backend on Linux
        working-directory: src-tauri
        # ARM64 runner 仅 16GB 内存,而本后端 debug 测试构建峰值内存极高(曾在
        # 27GB 本地机 LLVM OOM);除 Cargo.toml 的 [profile.test] debug=0 外,
        # 再限制并行编译单元数,把峰值内存进一步压下来避免 101。
        env:
          CARGO_BUILD_JOBS: ${{ matrix.name == 'ARM64' && '2' || '4' }}
        run: cargo test --locked

      - name: Build Linux desktop bundles
        run: npx tauri build --bundles deb,rpm

      - name: Audit packages, sidecar and shared libraries
        run: bash scripts/verify-linux-bundles.sh src-tauri/target/release/bundle "${{ matrix.deb_arch }}"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: starhub-linux-${{ matrix.name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
