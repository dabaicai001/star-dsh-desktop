name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 去 Tauri 化 M4 第 3 步:原来的 linux-compat 门是 Tauri 链(webkit2gtk 依赖 +
# src-tauri 的 cargo test + tauri build)。壳换成上游 Electron 之后,能离线验的
# 门变成了这三类:域单测(sidecar-rust / Go / 前端纯逻辑)、provisioning 单测、
# 以及 **provisioning + 宿主进程冒烟**。后两类是新的关键门——它们证的是
# 「StarHub 组合装进 dsh profile 之后真的能跑」,正是发布链换掉的东西。
#
# 为什么不跑 Electron:窗口层要等一次真安装包(见 release.yml 的打包步骤),
# 而宿主进程 + 插件 + sidecar 的启动链在无头环境就能完整验证(上游
# apps/desktop/scripts/smoke-runtime.ts 同款路径)。

jobs:
  verify:
    name: Verify / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
          - name: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Test frontend pure logic
        run: npm run test:utils

      - name: Test Go sidecar
        working-directory: sidecar
        run: go test ./...

      - name: Test Rust sidecar (domains + protocol)
        # sidecar-rust 是 M1 起域逻辑的新家。src-tauri 已退役(M4 第 4 步),
        # 这道门由它独担——原来的 src-tauri 全量 cargo test 内存峰值 27GB,
        # CI 上跑不动。
        # ARM64 runner 仅 16GB 内存,限制并行编译单元。
        env:
          CARGO_BUILD_JOBS: ${{ matrix.name == 'ARM64' && '2' || '4' }}
        run: cargo test --manifest-path sidecar-rust/Cargo.toml

      - name: Test provisioning merge logic
        run: npm run test:provision

      - name: Build sidecars and workbench dist
        # 冒烟的前置:两个 sidecar 二进制 + React 工作台 dist。
        run: |
          npm run sidecar:build
          npm run sidecar-rust:build
          npm run build:window

      - name: Package dsh runtime
        # 冒烟要用打包进去的便携 node 启动宿主进程(CLI 入口依赖 import.meta.main,
        # 需 Node ≥24.2;开发机上的 node 24.0 会让进程静默退出 0)。
        run: npm run package:dsh-runtime

      - name: Smoke: provisioning + host boot
        # 五条断言:工作台 index / invoke 打通 / 未知命令错误通路 / SSE 流 /
        # Go sidecar 活着。见 scripts/smoke-dsh-desktop.mjs。
        run: npm run smoke:dsh-desktop
