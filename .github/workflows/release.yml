name: Release desktop bundles

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 去 Tauri 化 M4 第 4 步:发布链是「上游 Electron installer 原样分发 + StarHub
# provisioning」,src-tauri 已退役。
#
# **Linux 不发版(决策 A:等上游)**。上游桌面壳的 SUPPORTED_TARGETS 只有
# mac-arm64 / mac-x64 / win-x64,没有 Linux target
# (vendor/deepseek-harness/apps/desktop/scripts/desktop-build-paths.mjs);
# 原来 Tauri 链产出 deb/rpm 的能力随 src-tauri 一起退役。等上游出了 Linux
# target,这里加一个 job 即可,StarHub 不需要自己维护第二条打包路径。
#
# macOS 同理:上游支持 mac-arm64 / mac-x64,但没有签名/公证证书,本期只发
# Windows(证书就位后照抄 windows job 改 target 名即可)。

jobs:
  windows:
    name: Windows / x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    # 打包路径根治:仓库被 checkout 到 D:\a\<org>\<repo>\<repo>(~84 字符),叠加
    # pnpm deploy 嵌套 node_modules 与 mistralai/otel 超长文件名,总路径超出
    # Windows 260 字符上限 → electron-builder 的 `File /r` 报 "failed opening
    # file" 打包失败。这里把工作区 subst 到短盘符 S:\,所有 run 默认以 S:\ 为
    # working-directory,最长路径被压到 ~200 字符内。
    defaults:
      run:
        working-directory: 'S:\'
    env:
      DSH_BUILD_WORKSPACE: 'S:\'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Map workspace to a short drive (Windows path-length fix)
        # 必须先于 S:\ 默认 working-directory 生效:本步负责创建 subst 映射,
        # 若沿用 job 默认的 S:\ 作为 cwd,pwsh 会因 S:\ 尚不存在而无法启动
        # ("directory name is invalid")。故显式回到真实 checkout 目录执行 subst,
        # 并校验映射确实建立,失败立即中止(否则下游会冒 "dir not found" 级联报错)。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          subst S: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'S:\')) {
            throw "subst S: -> $env:GITHUB_WORKSPACE failed (drive may be in use)"
          }
          Get-ChildItem S:\
          Write-Host "workspace mapped to S:\ ($env:GITHUB_WORKSPACE)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Test frontend and Go sidecar
        shell: pwsh
        run: |
          npm run test:utils
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location sidecar
          go test ./...
          $testExit = $LASTEXITCODE
          Pop-Location
          exit $testExit

      - name: Test Rust sidecar
        # src-tauri 退役后域单测全在 sidecar-rust;M4 之前这道门是 src-tauri 的
        # 全量 cargo test(内存峰值 27GB,CI 上也跑不动)。
        run: scripts\cargo-sidecar.bat test

      - name: Build release sidecars
        # provisioning 要装的就是这两个二进制;release 构建。
        run: |
          npm run sidecar:build:release
          npm run sidecar-rust:build:release

      - name: Package dsh runtime
        # 上游 desktop 的 prepare:primary-runtime 与我们的 provisioning 共用这份
        # 运行时树(provisioning 的 --runtime 指向它)。
        run: npm run package:dsh-runtime

      - name: Build StarHub React window resources
        # provisioning 装进 <home>/starhub/resources/starhub-react,host-static 的
        # windowDist 指过去。
        run: npm run build:window

      - name: Assemble the pure-plugin bundle tarball
        # 纯插件形态的发布资产(libs / 工作台 dist / 两个 sidecar 与 installer 同源),
        # 因此在这里产出而不是单开一条 workflow:同一个 tag 触发两条链会各自重建
        # 一遍 release sidecar,实测各占 ~15 分钟。
        #
        # 直接 node 调用:`npm run plugin:bundle -- --pack` 在 Windows PowerShell 下
        # 会被吞掉 `--pack`(踩坑记录 §61),CI 的 windows runner 默认就是 pwsh。
        run: node scripts/build-plugin-bundle.mjs --pack

      - name: Verify plugin tarball contents
        # 包体是「装完能不能跑」的全部:两个 sidecar、工作台 dist、客户端半边必须
        # 真的在 tarball 里,且不得夹带 sourcemap(踩坑记录 §59/§60 之外的体积坑)。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = (Get-ChildItem starhub-dsh-plugin-*.tgz | Select-Object -First 1).Name
          if (-not $asset) { throw '没产出 starhub-dsh-plugin-*.tgz' }
          $entries = tar -tzf $asset
          $required = @(
            'package/package.json',
            'package/cordis.patch.yml',
            'package/bridge/sidecar/starhub-sidecar-rust.exe',
            'package/bridge/sidecar/starhub-sidecar.exe',
            'package/host-static/dist/index.html',
            'package/client-nav/lib/client.js'
          )
          foreach ($needle in $required) {
            if (-not ($entries -match [regex]::Escape($needle))) { throw "tarball 缺少 $needle" }
          }
          if ($entries -match '\.map$') { throw 'tarball 不该带 sourcemap' }
          Write-Host "tarball $asset 内容校验通过($($entries.Count) 项,含两个 sidecar 与工作台 dist)"

      - name: 'Smoke: plugin tarball install + host boot'
        # 复刻插件页的安装动作(pnpm add <tarball> + 选入 dsh.profile.bundles),
        # 再起宿主验五条断言(包内 dist / 包内 sidecar / 错误通路 / SSE / 客户端半边)。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = (Get-ChildItem starhub-dsh-plugin-*.tgz | Select-Object -First 1).FullName
          node scripts/smoke-plugin-bundle.mjs --spec "$asset" --timeout 180000
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 'Smoke: provisioning + host boot'
        # 发布前的最后一道可离线验的门:provisioning 一个一次性 DSH_HOME 并用
        # dsh-runtime 里的便携 node boot 宿主进程,断言五条(工作台 index /
        # invoke 打通 / 未知命令错误通路 / SSE 流 / Go sidecar 活着)。
        run: npm run smoke:dsh-desktop

      - name: Write apps/desktop/.env.windows (packaging settings)
        # 上游打包脚本要求 apps/desktop/.env.windows 存在——它被 gitignore,因为
        # 装签名证书与更新源。CI 里从 GitHub Secrets 物化:发布 id 每一批必须稳定
        # (重试与升级测试复用同一个),不能每次跑都重新生成,所以它是 secret 而
        # 不是脚本里现算。
        #
        # 需要配置的 secret(仓库 Settings → Secrets and variables → Actions):
        #   DOWNLOAD_TEST_RELEASE_ID                  必填,32 位小写十六进制
        #   DSH_DESKTOP_APP_ID                        缺省 com.starhub.app
        #   DSH_DESKTOP_AUTO_UPDATE_ENV               缺省 test
        #   DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN  缺省 https://github.com
        #   DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN  缺省 https://github.com
        #   DSH_DESKTOP_MANDATORY_UPDATE_AUTH_ORIGINS 缺省 https://github.com
        #   DOWNLOAD_TEST_ORIGIN                      缺省 https://github.com
        # 缺 DOWNLOAD_TEST_RELEASE_ID 时本步就 fail loud 并说清缺哪一项,不要留给
        # 上游打包脚本报一句读不到文件。
        shell: pwsh
        env:
          SECRET_APP_ID: ${{ secrets.DSH_DESKTOP_APP_ID }}
          SECRET_UPDATE_ENV: ${{ secrets.DSH_DESKTOP_AUTO_UPDATE_ENV }}
          SECRET_RELEASE_ID: ${{ secrets.DOWNLOAD_TEST_RELEASE_ID }}
          SECRET_TEST_ORIGIN: ${{ secrets.DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN }}
          SECRET_PROD_ORIGIN: ${{ secrets.DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN }}
          SECRET_AUTH_ORIGINS: ${{ secrets.DSH_DESKTOP_MANDATORY_UPDATE_AUTH_ORIGINS }}
          SECRET_DOWNLOAD_ORIGIN: ${{ secrets.DOWNLOAD_TEST_ORIGIN }}
        run: |
          $appId        = if ($env:SECRET_APP_ID)        { $env:SECRET_APP_ID }        else { 'com.starhub.app' }
          $updateEnv    = if ($env:SECRET_UPDATE_ENV)    { $env:SECRET_UPDATE_ENV }    else { 'test' }
          $testOrigin   = if ($env:SECRET_TEST_ORIGIN)   { $env:SECRET_TEST_ORIGIN }   else { 'https://github.com' }
          $prodOrigin   = if ($env:SECRET_PROD_ORIGIN)   { $env:SECRET_PROD_ORIGIN }   else { 'https://github.com' }
          $authOrigins  = if ($env:SECRET_AUTH_ORIGINS)  { $env:SECRET_AUTH_ORIGINS }  else { 'https://github.com' }
          $downloadOrig = if ($env:SECRET_DOWNLOAD_ORIGIN) { $env:SECRET_DOWNLOAD_ORIGIN } else { 'https://github.com' }
          $releaseId    = $env:SECRET_RELEASE_ID
          if (-not $releaseId) {
            throw "缺少 secret DOWNLOAD_TEST_RELEASE_ID(32 位小写十六进制,每批稳定;重试与升级测试复用同一个)。在仓库 Settings -> Secrets and variables -> Actions 里添加后再跑。"
          }
          if ($releaseId -notmatch '^[0-9a-f]{32}$') {
            throw "DOWNLOAD_TEST_RELEASE_ID 必须是 32 位小写十六进制,收到: '$releaseId'"
          }
          $authConfig = "{`"allowedAuthOrigins`":[`"$authOrigins`"]}"
          $lines = @(
            "# 由 release.yml 从 GitHub Secrets 物化;勿手改(该文件被 gitignore)。"
            "DSH_DESKTOP_APP_ID=$appId"
            "DSH_DESKTOP_AUTO_UPDATE_ENV=$updateEnv"
            "DOWNLOAD_TEST_ORIGIN=$downloadOrig"
            "DOWNLOAD_TEST_RELEASE_ID=$releaseId"
            "DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=$testOrigin"
            "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=$prodOrigin"
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='$authConfig'"
          )
          $target = Join-Path $env:GITHUB_WORKSPACE 'vendor\deepseek-harness\apps\desktop\.env.windows'
          Set-Content -Path $target -Value $lines -Encoding utf8
          Write-Host "已写出 $target(app id=$appId, update env=$updateEnv, release id=$($releaseId.Substring(0,4))…)"

      - name: Package upstream Electron shell (unsigned)
        # 上游 electron-builder 链原样用;`--unsigned` 因为没有代码签名证书。
        # 产物落在 apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts。
        # 签名/公证是上游的品牌与更新栈,见 M4 清单 §五。
        run: pnpm --dir vendor/deepseek-harness/apps/desktop run package:win:x64:unsigned

      - name: Provision StarHub into a clean profile
        # 上游壳不会知道 StarHub 的存在:把 10 个包 + 两个 sidecar + 工作台 dist
        # 装进一个干净的 DSH_HOME。部署形态下由安装后置脚本做同一件事,这里在 CI
        # 里先验一遍「装的顺序与内容是对的」(真安装包的验收见 M4 清单待办)。
        run: |
          node scripts/provision-dsh.mjs `
            --home $env:RUNNER_TEMP\starhub-dsh-home `
            --profile desktop `
            --sidecar-rust sidecar-rust\target\release\starhub-sidecar-rust.exe `
            --sidecar-go sidecar\bin\starhub-sidecar.exe `
            --window-dist dist-starhub-react

      - name: Upload plugin tarball
        uses: actions/upload-artifact@v4
        with:
          name: starhub-plugin-bundle-${{ github.ref_name }}
          path: starhub-dsh-plugin-*.tgz
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: starhub-windows-x86_64-${{ github.ref_name }}
          path: vendor/deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source (for CHANGELOG at the tag)
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: starhub-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        # 从 CHANGELOG.md 生成 Release 正文(升级变更日志)。
        # 优先提取当前版本节(发版时改动会从 [未发布] 移到版本节);找不到版本节
        # 才回退 `## [未发布]`。
        # 提取范围:命中的 `## [` 到下一个 `---` 分隔符;剔除「### 计划中」块
        # (未发布计划,不该进已发布版本的 notes)。发版约定见 AGENTS.md 版本纪律。
        #
        # 两个坑,都是这次升 v0.128.0 时实测抓到的:
        # ① 匹配必须用**前缀正则**,不能整行相等。版本标题长这样:
        #    `## [0.128.0] - 2026-10-10`(带日期),永远不等于 `## [0.128.0]`。
        #    整行相等的写法让 active 永远是 0,提取结果恒为空——上面那个
        #    grep 用的是前缀正则所以能选中 SECTION,两边不一致,于是每个版本
        #    都走到「没提取到」。
        # ② 提取为空必须**失败**,不能只 warning。空 notes 的 Release 看起来
        #    是成功的,用户点开什么都没有,比发布失败更难发现。
        shell: bash
        env:
          REL_VERSION: ${{ github.ref_name }}   # 形如 v0.114.1
        run: |
          VER="${REL_VERSION#v}"
          if grep -q "^## \[$VER\]" CHANGELOG.md; then
            SECTION="$VER"
          else
            SECTION="未发布"
            echo "::warning::CHANGELOG.md 没有版本节 '## [$VER]',回退到 '## [未发布]' 提取"
          fi
          awk -v sec="$SECTION" '
            /^## \[/ { if (active) exit; if ($0 ~ "^## \\[" sec "\\]") active = 1; next }
            active && /^---/ { exit }
            active && /^### 计划中/ { planned = 1 }
            active && !planned { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md 里没提取到 '$SECTION' 节的正文,Release 不能不带变更日志"
            exit 1
          else
            echo "---- extracted release notes ----"
            cat RELEASE_NOTES.md
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: StarHub ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.tgz
