name: Release desktop bundles

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows / x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    # 打包路径根治:仓库被 checkout 到 D:\a\<org>\<repo>\<repo>(~84 字符),叠加
    # pnpm deploy 嵌套 node_modules 与 mistralai/otel 超长文件名,总路径超出
    # Windows 260 字符上限 → NSIS `File /r` 报 "failed opening file" 打包失败。
    # 这里把工作区 subst 到短盘符 S:\,所有 run 默认以 S:\ 为 working-directory,
    # 最长路径被压到 ~200 字符内(方案 A;配合 package-dsh-runtime 的 .d.ts 裁剪)。
    defaults:
      run:
        working-directory: 'S:\'
    env:
      DSH_BUILD_WORKSPACE: 'S:\'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Map workspace to a short drive (Windows path-length fix)
        # 必须先于 S:\ 默认 working-directory 生效:本步负责创建 subst 映射,
        # 若沿用 job 默认的 S:\ 作为 cwd,pwsh 会因 S:\ 尚不存在而无法启动
        # ("directory name is invalid")。故显式回到真实 checkout 目录执行 subst,
        # 并校验映射确实建立,失败立即中止(否则下游会冒 "dir not found" 级联报错)。
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          subst S: $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'S:\')) {
            throw "subst S: -> $env:GITHUB_WORKSPACE failed (drive may be in use)"
          }
          Get-ChildItem S:\
          Write-Host "workspace mapped to S:\ ($env:GITHUB_WORKSPACE)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Test frontend and Go sidecar
        shell: pwsh
        run: |
          npm run test:utils
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location sidecar
          go test ./...
          $testExit = $LASTEXITCODE
          Pop-Location
          exit $testExit

      - name: Build release sidecar
        run: npm run sidecar:build:release

      - name: Package dsh runtime
        run: npm run package:dsh-runtime

      - name: Build StarHub React window resources
        # `dist-starhub-react` is a Tauri bundle resource (tauri.conf.json
        # bundle.resources). It is only staged by build:window, which otherwise
        # runs only inside `tauri build`'s beforeBuildCommand — too late for the
        # build-script resource check behind `cargo test` below. Stage it here so
        # tauri_build can validate the resource path on a clean checkout.
        run: npm run build:window

      - name: Test Tauri backend
        working-directory: 'S:\src-tauri'
        run: cargo test --locked

      - name: Build Windows installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: starhub-windows-x86_64-${{ github.ref_name }}
          path: S:\src-tauri\target\release\bundle\nsis\*.exe
          if-no-files-found: error

  linux:
    name: Linux / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
          - name: ARM64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          # ARM64 runners fetch from ports.ubuntu.com which is prone to
          # transient timeouts; configure apt retries and loop the install.
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install --no-install-recommends -y \
              build-essential \
              cpio \
              file \
              libayatana-appindicator3-dev \
              libfuse2 \
              libgtk-3-dev \
              libpipewire-0.3-dev \
              libspa-0.2-dev \
              librsvg2-dev \
              libsqlite3-dev \
              libssl-dev \
              libwebkit2gtk-4.1-dev \
              libxdo-dev \
              patchelf \
              pkg-config \
              rpm && break
            echo "apt-get install attempt $i failed, retrying in 10s..."
            sleep 10
            sudo apt-get update
          done
          # Verify the critical package installed; fail loudly if not.
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || { echo "ERROR: libwebkit2gtk-4.1-dev not installed"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Test frontend and Go sidecar
        run: |
          npm run test:utils
          (cd sidecar && go test ./...)

      - name: Build release sidecar
        run: npm run sidecar:build:release

      - name: Package dsh runtime
        run: npm run package:dsh-runtime

      - name: Build StarHub React window resources
        # `dist-starhub-react` is a Tauri bundle resource (tauri.conf.json
        # bundle.resources). It is only staged by build:window, which otherwise
        # runs only inside `tauri build`'s beforeBuildCommand — too late for the
        # build-script resource check behind `cargo test` below. Stage it here so
        # tauri_build can validate the resource path on a clean checkout.
        run: npm run build:window

      - name: Test Tauri backend
        working-directory: src-tauri
        # ARM64 runner 仅 16GB 内存;debug 测试构建峰值内存极高(Cargo.toml
        # [profile.test] debug=0 + 这里限制并行编译单元)避免 LLVM OOM → 101。
        env:
          CARGO_BUILD_JOBS: ${{ matrix.name == 'ARM64' && '2' || '4' }}
        run: cargo test --locked

      - name: Build Linux desktop bundles
        run: npx tauri build --bundles deb,rpm

      - name: Audit packages, sidecar and shared libraries
        run: bash scripts/verify-linux-bundles.sh src-tauri/target/release/bundle "${{ matrix.deb_arch }}"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: starhub-linux-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-22.04

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: starhub-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: StarHub ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
