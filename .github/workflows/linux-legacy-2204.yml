name: Linux legacy (Ubuntu 22.04 / glibc 2.35)

# 为旧系统(Ubuntu 22.04 / Debian 12 / Fedora 38 等 glibc 2.35+ 桌面发行版)单独产出
# 「无截图」兼容包。默认 Linux 构建基线是 ubuntu-24.04(glibc 2.39),因为截图栈
# xcap → pipewire/libspa 0.10.1 需要系统 PipeWire/spa 头 ≥ 1.0(仅 24.04+ 满足)。
# 这里用 ubuntu-22.04 runner 以 `--no-default-features`(关闭截图特性)构建,
# 不编译 xcap/pipewire 链,从而把 glibc 下限保持在 2.35,兼容 Ubuntu 22.04。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-legacy-2204:
    name: Ubuntu 22.04 / ${{ matrix.name }} (no screenshot)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-22.04
            deb_arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cpio \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libegl-dev \
            libfuse2 \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            librsvg2-dev \
            libsqlite3-dev \
            libssl-dev \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxdo-dev \
            libxrandr-dev \
            patchelf \
            pkg-config \
            rpm
          dpkg -s libwebkit2gtk-4.1-dev >/dev/null 2>&1 || { echo "ERROR: libwebkit2gtk-4.1-dev not installed"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache-dependency-path: sidecar/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Install dsh runtime dependencies
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile

      - name: Build release sidecar
        run: npm run sidecar:build:release

      - name: Package dsh runtime
        run: npm run package:dsh-runtime

      - name: Build StarHub React window resources
        run: npm run build:window

      - name: Build Linux desktop bundles (no screenshot, glibc 2.35 baseline)
        # `--no-default-features` 关闭截图特性:不引入 xcap/pipewire,编译在
        # Ubuntu 22.04 的旧头文件上即可通过,产物 glibc 下限回到 2.35。
        run: npx tauri build --no-default-features --bundles deb,rpm

      - name: Audit packages, sidecar and shared libraries
        run: bash scripts/verify-linux-bundles.sh src-tauri/target/release/bundle "${{ matrix.deb_arch }}"

      - name: Rename legacy bundles (distinct from the glibc 2.39 build)
        # 标准 linux 任务与 legacy 任务在同一 release 里都会产出
        # StarHub-<version>-1.<arch>.deb/.rpm(文件名相同),publish 用 merge-multiple
        # 合并后会同名冲突/覆盖。这里加 `-ubuntu2204` 后缀区分,便于用户识别兼容版。
        run: |
          cd src-tauri/target/release/bundle
          for f in deb/*.deb rpm/*.rpm; do
            dir="$(dirname "$f")"
            base="$(basename "$f")"
            name="${base%.*}"
            ext="${base##*.}"
            case "$base" in
              *ubuntu2204*) : ;;
              *) mv "$f" "$dir/${name}-ubuntu2204.${ext}" ;;
            esac
          done
          ls -la deb rpm

      - name: Upload Linux legacy bundles
        uses: actions/upload-artifact@v4
        with:
          name: starhub-linux-ubuntu2204-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
