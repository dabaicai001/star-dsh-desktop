<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>StarHub</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #080d14; color: #7f8b99; font: 14px/1.6 ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="msg">STARHUB dsh 壳启动中…</div>
  <script>
    // 生产环境跳板页(P4a):frontendDist 指向本目录,窗口秒开;
    // 真实 dsh web GUI 由 Rust DshWebManager 在 setup 拉起(端口 3185,占用递增),
    // 本页轮询 dsh_web_url command,拿到地址后整窗跳转。
    // 取舍:不直接 frontendDist=remote URL —— 配置窗口在 setup 完成前就开始加载,
    // 远程地址此时未就绪会落在错误页且不会自动重试(见 docs/踩坑记录.md)。
    var msg = document.getElementById('msg')
    function poll() {
      var tauri = window.__TAURI_INTERNALS__
      if (!tauri || typeof tauri.invoke !== 'function') { setTimeout(poll, 500); return }
      tauri.invoke('dsh_web_url')
        .then(function (url) { if (url) location.replace(url); else setTimeout(poll, 500) })
        .catch(function (err) {
          msg.textContent = 'dsh web 未就绪:' + String(err) + '(重试中…)'
          setTimeout(poll, 1000)
        })
    }
    poll()
  </script>
</body>
</html>
