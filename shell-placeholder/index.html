<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>StarHub</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #080d14; color: #7f8b99; font: 14px/1.6 ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="msg">STARHUB dsh 壳启动中…</div>
  <script>
    // 生产环境跳板页(P4a):frontendDist 指向本目录,窗口秒开;
    // 真实 dsh web GUI 由 Rust DshWebManager 在 setup 拉起(端口 3085,占用递增),
    // 本页轮询 dsh_web_url command 探知就绪;拿到 URL 后由 Rust 用原生导航
    // (WebviewWindow::navigate,host 发起)把本窗导过去。
    // v0.121.5:本页不再自导航——DSH 0.1.6 的会话 cookie 是 SameSite=Strict,
    // 从 tauri.localhost 源发起的 location.replace 到 127.0.0.1:<port> 属跨站
    // 导航,303 换到的 cookie 不随重定向上行,壳会落 401 文本页且无重试(host
    // 发起的导航 site_for_cookies 为空,cookie 正常发送;见 docs/踩坑记录.md)。
    // 取舍:不直接 frontendDist=remote URL —— 配置窗口在 setup 完成前就开始加载,
    // 远程地址此时未就绪会落在错误页且不会自动重试(见 docs/踩坑记录.md)。
    var msg = document.getElementById('msg')
    function poll() {
      var tauri = window.__TAURI_INTERNALS__
      if (!tauri || typeof tauri.invoke !== 'function') { setTimeout(poll, 500); return }
      tauri.invoke('dsh_web_url')
        .then(function (url) {
          // Rust 已在 command 内完成原生导航,本文档随即被替换、轮询自然终止;
          // 若导航因故未生效,继续轮询重试(ensure_started 幂等,navigate 有同源跳过保护)。
          msg.textContent = url ? 'dsh web 已就绪,正在打开…' : 'dsh web 启动中…'
          setTimeout(poll, url ? 1000 : 500)
        })
        .catch(function (err) {
          msg.textContent = 'dsh web 未就绪:' + String(err) + '(重试中…)'
          setTimeout(poll, 1000)
        })
    }
    poll()
  </script>
</body>
</html>
