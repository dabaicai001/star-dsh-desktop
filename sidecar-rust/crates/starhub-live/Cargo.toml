[package]
name = "starhub-live"
description = "StarHub live/takeover frame hub: local WebSocket frame export for the drop-Tauri migration M3 (browser / Android / sandbox frame sources), replacing the retired Tauri live windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Android 帧源:adb 调用 / serial 白名单 / 键名映射 / PNG 修复(与域工具同一份)
starhub-domain-android = { path = "../starhub-domain-android" }
# 帧出口:本地 WS server(127.0.0.1 + 一次性 token)与异步任务
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
