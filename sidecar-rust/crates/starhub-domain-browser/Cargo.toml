[package]
name = "starhub-domain-browser"
description = "StarHub AI-browser domain: model-facing action parsing and the injected page script, extracted from the retired Tauri shell (M1 of the drop-Tauri migration)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "starhub_domain_browser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
