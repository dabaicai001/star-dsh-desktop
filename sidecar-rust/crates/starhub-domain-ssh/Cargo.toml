[package]
name = "starhub-domain-ssh"
description = "StarHub SSH/SFTP domain: russh sessions, host-key policy, and SFTP transfers with storage and event seams (extracted from the retired Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
glob-match = "0.2"
once_cell = "1"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
async-trait = "0.1"
