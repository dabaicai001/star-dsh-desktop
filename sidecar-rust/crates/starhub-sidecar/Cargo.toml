[package]
name = "starhub-sidecar"
description = "StarHub Rust sidecar: stdio JSON-RPC surface for the StarHub tool domains extracted from the retired Tauri shell (M1 of the drop-Tauri migration)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "starhub_sidecar"
path = "src/lib.rs"

[[bin]]
name = "starhub-sidecar-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 联动契约:领域事件 schema + 模型可读能力文本(与 src-tauri 同一份 crate)
starhub-contract = { path = "../starhub-contract" }
# 域运行时:SSH/SFTP 会话 + 传输(与 src-tauri 同一份域 crate)
starhub-domain-ssh = { path = "../starhub-domain-ssh" }
# DB/Redis/ES/Docker 域:Go sidecar 客户端 + 模型面执行器
starhub-domain-db = { path = "../starhub-domain-db" }
# Desktop 域:模板配方 + 任务授权 + xdotool/scrot 编排
starhub-domain-desktop = { path = "../starhub-domain-desktop" }
# Android 域:adb 调用 + 任务授权 + 20 个工具执行体
starhub-domain-android = { path = "../starhub-domain-android" }
# Browser 域:16 个工具的参数契约 + 页面注入脚本(引擎层随 M3)
starhub-domain-browser = { path = "../starhub-domain-browser" }
# 异步域方法经 Runtime::block_on 在 stdio 线程上执行;process/io-util 供
# ui.local_shell_exec 的本机 shell 捕获输出
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = "0.4"
