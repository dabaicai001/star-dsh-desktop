[package]
name = "starhub"
version = "0.92.4"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
glob-match = "0.2"
tokio-util = "0.7"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate"] }
# Web 网关上游 HTTPS:经 SSH direct-tcpip 通道之上的端到端 TLS(版本与 reqwest 锁定的一致);
# 显式启用 ring provider:reqwest(rustls-tls → ring)+ tokio-rustls 默认(aws-lc-rs)会让
# rustls 0.23 同时带两个 CryptoProvider,ClientConfig::builder() 无法自动抉择会 panic,
# 这里启用 ring 并在 web_gateway.rs 中 builder_with_provider(ring) 显式指定。
tokio-rustls = { version = "0.26", features = ["ring"] }
webpki-roots = "1"
futures = "0.3"
bytes = "1"
keyring-core = "1.0.0"
# dsh 用户插件安装(支线 B):GitHub codeload zip 解包;只开 deflate,关掉其余压缩格式
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 测试二进制编译内存兜底:本后端(8W+ 行 + russh/sqlx/reqwest/rustls 全家桶)
# 的 debug 测试构建(-C debuginfo=2)峰值内存极高,27GB 本地机都曾在 LLVM 阶段
# OOM;GitHub 的 ubuntu-22.04-arm runner 仅 4GB,跑 `cargo test` 时必然
# `rustc-LLVM ERROR: out of memory` → 退出码 101(runs/32224539580)。
# 测试编译关掉 debuginfo,峰值内存骤降,4GB ARM64 runner 即可通过;
# 本地开发(dev profile 默认 -C debuginfo=2)不受影响。
[profile.test]
debug = 0
