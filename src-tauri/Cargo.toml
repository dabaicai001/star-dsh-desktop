[package]
name = "starhub"
version = "0.103.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
glob-match = "0.2"
tokio-util = "0.7"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate"] }
# Web 网关上游 HTTPS:经 SSH direct-tcpip 通道之上的端到端 TLS(版本与 reqwest 锁定的一致);
# 显式启用 ring provider:reqwest(rustls-tls → ring)+ tokio-rustls 默认(aws-lc-rs)会让
# rustls 0.23 同时带两个 CryptoProvider,ClientConfig::builder() 无法自动抉择会 panic,
# 这里启用 ring 并在 web_gateway.rs 中 builder_with_provider(ring) 显式指定。
tokio-rustls = { version = "0.26", features = ["ring"] }
webpki-roots = "1"
futures = "0.3"
bytes = "1"
keyring-core = "1.0.0"
# dsh 用户插件安装(支线 B):GitHub codeload zip 解包;只开 deflate,关掉其余压缩格式
zip = { version = "2", default-features = false, features = ["deflate"] }
# AI 对话截图(区域):跨平台屏幕捕获(Windows WGC / macOS ScreenCaptureKit / Linux X11+Wayland)。
# 仅在 `screenshot` 特性开启时引入:Linux 上 xcap → pipewire/libspa 0.10.1 需要系统
# PipeWire/spa 头 ≥ 1.0(Ubuntu 24.04+),Ubuntu 22.04(glibc 2.35)无法编译/运行该链,
# 因此「Ubuntu 22.04 兼容版」用 `--no-default-features` 关闭截图以回到 glibc 2.35 基线。
xcap = { version = "0.9.8", features = ["image", "wgc"], optional = true }
# 截图编码(PNG/JPEG)与多显示器拼接(仅截图特性)
image = { version = "0.25.10", optional = true }
# base64 此前仅截图特性使用;AI 浏览器 CDP 截图(Windows)与 WKWebView/WebKitGTK
# 截图也要用,提升为常驻依赖(纯 Rust 小 crate,不影响 glibc 2.35 兼容版基线)。
base64 = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
# AI 浏览器 M2:WebView2 CDP(CallDevToolsProtocolMethod)。版本必须与 tauri → wry
# 传递依赖锁定一致(0.38.x),否则 PlatformWebview.controller() 的类型对不上。
webview2-com = "0.38"
windows = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }
# AI 浏览器 M3:WKWebView takeSnapshot 截图。版本与 wry 0.55 的 apple 依赖对齐;
# feature 按类名开启(cargo 与 wry 已开的部分取并集)。
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSData", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
# AI 浏览器 M3:WebKitGTK get_snapshot 截图。webkit2gtk 版本必须与 wry 0.55 锁死
# 一致(=2.0.2),否则 PlatformWebview.inner() 返回的 webkit2gtk::WebView 类型不同源。
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
cairo-rs = { version = "0.18", features = ["png"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol", "screenshot"]
custom-protocol = ["tauri/custom-protocol"]
# AI 对话截图(区域)。默认开启;面向旧系统(Ubuntu 22.04 / glibc 2.35,系统
# PipeWire < 1.0)的兼容版用 `--no-default-features` 关闭截图,从而避免引入
# xcap → pipewire/libspa 0.10.1(需 spa 头 ≥ 1.0)把 glibc 下限抬到 2.39。
screenshot = ["dep:xcap", "dep:image"]

# 测试二进制编译内存兜底:本后端(8W+ 行 + russh/sqlx/reqwest/rustls 全家桶)
# 的 debug 测试构建(-C debuginfo=2)峰值内存极高,27GB 本地机都曾在 LLVM 阶段
# OOM;GitHub 的 ubuntu-22.04-arm runner 仅 4GB,跑 `cargo test` 时必然
# `rustc-LLVM ERROR: out of memory` → 退出码 101(runs/32224539580)。
# 测试编译关掉 debuginfo,峰值内存骤降,4GB ARM64 runner 即可通过;
# 本地开发(dev profile 默认 -C debuginfo=2)不受影响。
[profile.test]
debug = 0
